base_config: base.yaml

experiment_name: high-stakes-detection
backbone_name: gemma-3-12b-it-vanilla
backbone_family: gemma-3-12b-it
backbone_variant: vanilla
model_name: google/gemma-3-12b-it

artifact_layout:
  enabled: true
  output_root: results/probe_training
  checkpoint_root: checkpoints/probes
  run_name: rmsnorm-vanilla-v1

wandb_group: high-stakes-gemma3-12b-vanilla
wandb_name_prefix: high-stakes-gemma3-12b-vanilla

eval_splits:
  - dev
  - test_anthropic_hh_balanced
  - test_aya_redteaming_balanced
  - test_mental_health_balanced
  - test_mt_balanced
  - test_mts_balanced
  - test_toolace_balanced
threshold_calibration_split: dev

data:
  format: labelled_text
  files:
    train:
      - data/high-stakes/training/train.jsonl
      - data/high-stakes/anthropic_hh_balanced/validation.jsonl
      - data/high-stakes/mt_balanced/validation.jsonl
      - data/high-stakes/mts_balanced/validation.jsonl
      - data/high-stakes/toolace_balanced/validation.jsonl
    dev: data/high-stakes/training/test.jsonl
    test_anthropic_hh_balanced: data/high-stakes/anthropic_hh_balanced/test.jsonl
    test_aya_redteaming_balanced: data/high-stakes/aya_redteaming_balanced/test.jsonl
    test_mental_health_balanced: data/high-stakes/mental_health_balanced/test.jsonl
    test_mt_balanced: data/high-stakes/mt_balanced/test.jsonl
    test_mts_balanced: data/high-stakes/mts_balanced/test.jsonl
    test_toolace_balanced: data/high-stakes/toolace_balanced/test.jsonl
  id_field: ids
  input_field: inputs
  label_field: labels
  label_mapping:
    low-stakes: 0
    high-stakes: 1
    "0": 0
    "1": 1
  drop_label_values: [ambiguous, "2"]
  chat_template:
    mode: auto
    add_generation_prompt: false
  print_rows: 2

