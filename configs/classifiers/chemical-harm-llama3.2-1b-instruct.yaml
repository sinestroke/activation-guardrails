base_config: base.yaml

experiment_name: scheduled-chemical-harm-detection
run_name: llama3.2-1b-instruct-v1
backbone_name: llama-3.2-1b-instruct
classifier_model_name: meta-llama/Llama-3.2-1B-Instruct
classifier_model_family: llama-3.2
classifier_model_size: 1b
model_name: meta-llama/Llama-3.2-1B-Instruct

output_dir: results/classifier_training/scheduled-chemical-harm-detection/llama-3.2-1b-instruct/v1
checkpoint_dir: checkpoints/classifiers/scheduled-chemical-harm-detection/llama-3.2-1b-instruct/v1
wandb_group: chemical-harm-llama3.2-1b-instruct
wandb_name_prefix: chemical-harm-llama3.2-1b-instruct

classifier:
  system_prompt_path: constitutions/chemical-harm-classifier.md
  positive_target: "YES"
  negative_target: "NO"
  chat_template_kwargs: {}

data:
  format: labelled_text
  files:
    train:
      - data/scheduled-chemical-harm-detection/train/train_matched_pairs.jsonl
      - data/scheduled-chemical-harm-detection/train/train_unmatched_harmful_prompts.jsonl
      - data/scheduled-chemical-harm-detection/train/train_wildguardmix_benign_500.jsonl
      - data/scheduled-chemical-harm-detection/train/train_mmlu_benign_250.jsonl
    dev:
      - data/scheduled-chemical-harm-detection/dev/dev_matched_pairs.jsonl
      - data/scheduled-chemical-harm-detection/dev/dev_mmlu_benign_50.jsonl
      - data/scheduled-chemical-harm-detection/dev/dev_wildguardmix_benign_100.jsonl
  id_field: ids
  input_field: inputs
  label_field: labels
  label_mapping:
    not_harmful: 0
    harmful: 1
    "0": 0
    "1": 1
  prefer_stored_token_ids: false
  chat_template:
    mode: auto
    role_policy: compatible
    add_generation_prompt: false
  print_rows: 2

