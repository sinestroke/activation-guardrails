base_config: base.yaml

experiment_name: high-stakes-detection
run_name: llama3.2-1b-instruct-v1
backbone_name: llama-3.2-1b-instruct
classifier_model_name: meta-llama/Llama-3.2-1B-Instruct
classifier_model_family: llama-3.2
classifier_model_size: 1b
model_name: meta-llama/Llama-3.2-1B-Instruct

output_dir: results/classifier_training/high-stakes-detection/llama-3.2-1b-instruct/v1
checkpoint_dir: checkpoints/classifiers/high-stakes-detection/llama-3.2-1b-instruct/v1
wandb_group: high-stakes-llama3.2-1b-vanilla
wandb_name_prefix: high-stakes-llama3.2-1b-vanilla

classifier:
  system_prompt_path: constitutions/high-stakes-classifier.md
  positive_target: "YES"
  negative_target: "NO"
  chat_template_kwargs: {}

data:
  format: labelled_text
  files:
    train:
      - data/high-stakes/training/train.jsonl
      - data/high-stakes/anthropic_hh_balanced/validation.jsonl
      - data/high-stakes/mt_balanced/validation.jsonl
      - data/high-stakes/mts_balanced/validation.jsonl
      - data/high-stakes/toolace_balanced/validation.jsonl
    dev: data/high-stakes/training/test.jsonl
  id_field: ids
  input_field: inputs
  label_field: labels
  label_mapping:
    low-stakes: 0
    high-stakes: 1
    "0": 0
    "1": 1
  drop_label_values: [ambiguous, "2"]
  chat_template:
    mode: auto
    add_generation_prompt: false
  print_rows: 2
